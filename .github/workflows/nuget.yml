name: NuGet Package

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # EVRPresenter.vcxproj pins v141 and Windows SDK 10.0.17134, neither of which ships on hosted runners.
  EVR_PLATFORM_TOOLSET: v143
  EVR_WINDOWS_SDK: '10.0'

jobs:
  pack:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Build EVR Presenter
        run: |
          foreach ($platform in 'Win32', 'x64') {
            msbuild 'EVR Presenter/EVRPresenter.vcxproj' -nologo -v:m `
              -p:Configuration=Release `
              -p:Platform=$platform `
              "-p:SolutionDir=$PWD/EVR Presenter/" `
              -p:PlatformToolset=$env:EVR_PLATFORM_TOOLSET `
              -p:WindowsTargetPlatformVersion=$env:EVR_WINDOWS_SDK
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build WPF MediaKit
        run: dotnet build 'Source/WPF MediaKit.csproj' -c Release -nologo

      - name: Pack
        working-directory: nuget
        run: nuget pack Package.nuspec -OutputDirectory out -NonInteractive

      - name: Verify package contents
        run: |
          $packages = @(Get-ChildItem nuget/out -Filter *.nupkg)
          if ($packages.Count -ne 1) { throw "Expected exactly one .nupkg, found $($packages.Count)" }
          $package = $packages[0]
          "PACKAGE_PATH=$($package.FullName)" >> $env:GITHUB_ENV
          "PACKAGE_VERSION=$($package.BaseName -replace '^QuickLook\.WPFMediaKit\.', '')" >> $env:GITHUB_ENV

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          $entries = $zip.Entries.FullName
          $reader = [IO.StreamReader]::new(($zip.Entries | Where-Object FullName -eq 'QuickLook.WPFMediaKit.nuspec').Open())
          [xml]$nuspec = $reader.ReadToEnd()
          $reader.Dispose()
          $zip.Dispose()

          $expected = @(
            'README.md'
            'build/QuickLook.WPFMediaKit.targets'
            'build/EVRPresenter32.dll'
            'build/EVRPresenter64.dll'
            'lib/net462/QuickLook.WPFMediaKit.dll'
            'lib/net462/QuickLook.WPFMediaKit.xml'
            'lib/net10.0-windows7.0/QuickLook.WPFMediaKit.dll'
            'lib/net10.0-windows7.0/QuickLook.WPFMediaKit.xml'
            'runtimes/win-x86/native/EVRPresenter32.dll'
            'runtimes/win-x64/native/EVRPresenter64.dll'
          )
          $missing = $expected | Where-Object { $_ -notin $entries }
          $entries | Sort-Object | ForEach-Object { "  $_" }
          if ($missing) { throw "Package is missing: $($missing -join ', ')" }

          $bundled = $entries | Where-Object { $_ -match 'DirectShowLib' }
          if ($bundled) { throw "DirectShowLib must come from the DirectShowLib.Standard dependency, but the package bundles: $($bundled -join ', ')" }

          foreach ($group in $nuspec.package.metadata.dependencies.group) {
            if ('DirectShowLib.Standard' -notin $group.dependency.id) { throw "Dependency group $($group.targetFramework) does not declare DirectShowLib.Standard" }
          }

      - name: Smoke test package consumers
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'consumer'
          New-Item -ItemType Directory $root -Force | Out-Null
          $env:NUGET_PACKAGES = Join-Path $root 'packages'
          $localSource = Split-Path $env:PACKAGE_PATH

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$localSource" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="QuickLook.WPFMediaKit" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          "@ | Set-Content (Join-Path $root 'nuget.config')

          $program = @'
          class Program
          {
              [System.STAThread]
              static int Main()
              {
                  try
                  {
                      new WPFMediaKit.DirectShow.Controls.MediaUriElement();
                      WPFMediaKit.MediaFoundation.EvrPresenter.CreateNew();
                      System.Console.WriteLine("EVR presenter created");
                  }
                  // Hosted runners have no GPU: the EVR DLL loads, but its D3D9 device may fail. Only a load failure (Win32Exception) is fatal.
                  catch (WPFMediaKit.WPFMediaKitException ex) when (ex.InnerException is not System.ComponentModel.Win32Exception)
                  {
                      System.Console.WriteLine("EVR presenter loaded, device unavailable: " + ex.InnerException?.Message);
                  }
                  catch (System.Exception ex)
                  {
                      System.Console.Error.WriteLine(ex);
                      return 1;
                  }
                  return 0;
              }
          }
          '@

          $scenarios = @(
            @{
              Name   = 'net10.0-windows build'
              Tfm    = 'net10.0-windows'
              Native = 'runtimes/win-x64/native/EVRPresenter64.dll', 'runtimes/win-x86/native/EVRPresenter32.dll'
            }
            @{
              Name   = 'net10.0-windows publish win-x64'
              Tfm    = 'net10.0-windows'
              Rid    = 'win-x64'
              Native = @('EVRPresenter64.dll')
            }
            @{
              Name   = 'net462 build'
              Tfm    = 'net462'
              Native = 'EVRPresenter32.dll', 'EVRPresenter64.dll'
            }
          )

          foreach ($scenario in $scenarios) {
            $tfm = $scenario.Tfm
            $dir = Join-Path $root $tfm
            New-Item -ItemType Directory $dir -Force | Out-Null

            @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>$tfm</TargetFramework>
              <UseWPF>true</UseWPF>
              <LangVersion>latest</LangVersion>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="QuickLook.WPFMediaKit" Version="$env:PACKAGE_VERSION" />
            </ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $dir 'Consumer.csproj')

            $program | Set-Content (Join-Path $dir 'Program.cs')

            Write-Host "::group::$($scenario.Name)"
            $project = Join-Path $dir 'Consumer.csproj'
            if ($scenario.Rid) {
              $output = Join-Path $root "publish-$($scenario.Rid)"
              dotnet publish $project -c Release -r $scenario.Rid --self-contained false -o $output -nologo
            } else {
              $output = Join-Path $dir "bin/Release/$tfm"
              dotnet build $project -c Release -nologo
            }
            if ($LASTEXITCODE -ne 0) { throw "$($scenario.Name): consumer failed to build" }

            foreach ($file in @('QuickLook.WPFMediaKit.dll', 'DirectShowLib.dll') + $scenario.Native) {
              if (-not (Test-Path (Join-Path $output $file))) { throw "$($scenario.Name): output is missing $file" }
            }

            & (Join-Path $output 'Consumer.exe')
            if ($LASTEXITCODE -ne 0) { throw "$($scenario.Name): consumer exited with code $LASTEXITCODE" }
            Write-Host '::endgroup::'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nuget/out/*.nupkg
          if-no-files-found: error
